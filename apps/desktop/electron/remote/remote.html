<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu karaokê</title><link rel="stylesheet" href="/remote.css"></head>
<body><main>
<header class="remote-header"><div class="remote-brand"><img id="brand-logo" alt="Logotipo do karaokê" hidden><h1 id="brand-title">Meu karaokê</h1></div><p id="connection" role="status">Conectando…</p></header>
<form id="pin-form" hidden><label for="pin">PIN do operador</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required><button>Desbloquear controle</button></form>
<div id="remote-content">
<section><h2>Tocando agora</h2><p id="playing">—</p><p id="score" hidden></p><div id="controls" class="transport-grid" hidden><button type="button" data-action="start" aria-label="Iniciar fila" class="transport primary "><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 11 7-11 7z"/></svg></span><span>Iniciar fila</span></button>
<button type="button" data-action="pause" aria-label="Pausar" class="transport primary "><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14M16 5v14"/></svg></span><span>Pausar</span></button>
<button type="button" data-action="resume" aria-label="Continuar" class="transport primary "><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 11 7-11 7z"/></svg></span><span>Continuar</span></button>
<button type="button" data-action="restart" aria-label="Reiniciar" class="transport  "><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7"/></svg></span><span>Reiniciar</span></button>
<button type="button" data-action="previous" aria-label="Anterior" class="transport"><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 5-10 7 10 7zM5 5v14"/></svg></span><span>Anterior</span></button>
<button type="button" data-action="skip" aria-label="Próxima" class="transport  "><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 5 10 7-10 7zM19 5v14"/></svg></span><span>Próxima</span></button>
<button type="button" data-action="back" aria-label="Voltar 10s" class="transport  "><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 5-7 7 7 7M5 12h15"/></svg></span><span>Voltar 10s</span></button>
<button type="button" data-action="pitchDown" aria-label="− Tom" class="transport  pitch-control"><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></span><span>− Tom</span></button>
<button type="button" data-action="pitchUp" aria-label="+ Tom" class="transport  pitch-control"><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg></span><span>+ Tom</span></button>
<button type="button" data-action="pitchReset" aria-label="Original" class="transport  pitch-control"><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13M9 7l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></svg></span><span>Original</span></button></div><p id="pitch-value" hidden>Tom original</p></section>
<form id="operator-score" hidden><h2>Nota do administrador</h2><label for="manual-score">Nota de 0 a 100</label><input id="manual-score" type="number" min="0" max="100" step="1" required><button>Confirmar nota</button></form>
<section id="reactions" hidden><h2>🎤 Avalie o cantor atual</h2><p class="hint">Escolha sua nota de 10 a 100</p><div id="rating-options" class="rating-grid"></div><p id="rating-feedback" aria-live="polite"></p></section>
<section id="photo-offer" hidden><h2>Registre este momento</h2><p>A pontuação liberou uma foto. Use a câmera deste celular.</p><button id="prepare-photo" class="camera-button" type="button">Abrir câmera</button><input id="photo" type="file" accept="image/*" capture="environment" hidden><img id="photo-preview" alt="Prévia da foto" hidden><a id="photo-download" class="camera-button" download="foto-karaoke.jpg" hidden>Baixar foto</a></section>
<section id="queue-section"><h2>☷ Fila de músicas</h2><ol id="queue"></ol></section>
<section id="history-section"><h2>Histórico da sessão</h2><ol id="session-history"></ol></section>
<form id="search"><h2>♫ Lista de músicas</h2><label for="name">Seu nome</label><input id="name" maxlength="40" autocomplete="given-name" required><label for="query">Qual música você quer cantar?</label><input id="query" maxlength="160" placeholder="Artista ou música" required><button id="search-button">Buscar karaokê no YouTube</button></form>
<p id="message" role="status"></p><div id="results"></div><small id="copyright"></small>
</div></main><script src="/remote.js"></script></body></html>
